<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d37" />
      <stop offset="50%" stop-color="#002d5a" />
      <stop offset="100%" stop-color="#021024" />
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="whiteG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgG)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4"/>
  <rect x="34" y="34" width="444" height="444" rx="94" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08"/>

  <!-- Centered AV Tech Mark -->
  <g filter="url(#softGlow)">
    <!-- Primary Delta 'A' Outer Frame -->
    <!-- Left Stem -->
    <polygon points="120,380 236,118 276,118 190,380" fill="url(#cyanG)"/>
    <!-- Right Stem -->
    <polygon points="322,380 236,118 276,118 392,380" fill="url(#blueG)"/>
    
    <!-- Central Interlocking 'V' Chevron -->
    <!-- Drops down with clean negative space cuts -->
    <polygon points="180,185 256,355 332,185 366,185 272,392 240,392 146,185" fill="url(#whiteG)"/>

    <!-- High-tech horizontal bridge (crossbar of A) with terminal prompt notch -->
    <polygon points="172,284 340,284 326,252 186,252" fill="url(#cyanG)" opacity="0.95"/>
    
    <!-- Active CLI Node / Telemetry Core -->
    <circle cx="256" cy="180" r="14" fill="#38bdf8"/>
    <circle cx="256" cy="180" r="7" fill="#ffffff"/>
  </g>
</svg>
