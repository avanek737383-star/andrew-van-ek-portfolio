<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="auto" style="background:#0d1117; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius:10px;">
  <!-- Title & Subtitle -->
  <text x="450" y="38" fill="#58a6ff" font-size="20" font-weight="700" text-anchor="middle">ELEGOO ESP-32 Zero-RF-Detuning Travel Enclosure</text>
  <text x="450" y="62" fill="#8b949e" font-size="13" text-anchor="middle">Parametric CAD Vertical Stackup &amp; Pin Suspension Architecture (Cross-Section)</text>

  <!-- Enclosure Bounds & Dimensions -->
  <!-- Base Outer Shell -->
  <rect x="180" y="110" width="540" height="350" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <!-- Base Floor (Z = 0 to 1.6mm) -->
  <rect x="180" y="430" width="540" height="30" fill="#21262d" stroke="#388bfd" stroke-width="1.5"/>
  <text x="450" y="450" fill="#c9d1d9" font-size="12" font-weight="600" text-anchor="middle">Base Floor (1.6 mm Thick Solid Thermoplastic)</text>
  
  <!-- Corner Standoffs (Z = 1.6 to 11.0mm) -->
  <rect x="210" y="270" width="50" height="160" fill="#238636" stroke="#2ea043" stroke-width="1.5" opacity="0.85"/>
  <rect x="640" y="270" width="50" height="160" fill="#238636" stroke="#2ea043" stroke-width="1.5" opacity="0.85"/>
  <text x="235" y="355" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" transform="rotate(-90 235 355)">Standoff Ledge</text>
  <text x="665" y="355" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" transform="rotate(90 665 355)">Standoff Ledge</text>

  <!-- Pin Drop Cavity (Open Air 9.4mm) -->
  <rect x="260" y="270" width="380" height="160" fill="#0d1117" stroke="#30363d" stroke-dasharray="4" stroke-width="1"/>
  
  <!-- Downward Header Pins (15 Left, 15 Right) -->
  <!-- Left Header Pins (8.5mm downward) -->
  <rect x="270" y="270" width="35" height="145" fill="#d29922" stroke="#e3b341" stroke-width="1.5"/>
  <text x="287" y="348" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle" transform="rotate(-90 287 348)">Header Pins (8.5mm)</text>
  <!-- Right Header Pins -->
  <rect x="595" y="270" width="35" height="145" fill="#d29922" stroke="#e3b341" stroke-width="1.5"/>
  <text x="612" y="348" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle" transform="rotate(90 612 348)">Header Pins (8.5mm)</text>

  <!-- Floating Pin Air Gap Indicator -->
  <line x1="270" y1="415" x2="305" y2="415" stroke="#f85149" stroke-width="2"/>
  <line x1="287" y1="415" x2="287" y2="430" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="424" fill="#f85149" font-size="11" font-weight="600">0.9 mm Free Float Air Gap (Zero Bend Risk)</text>

  <!-- PCB Board (Z = 11.0 to 12.6mm) -->
  <rect x="210" y="244" width="480" height="26" rx="2" fill="#1f6feb" stroke="#58a6ff" stroke-width="2"/>
  <text x="450" y="261" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">ESP32 DevKit V1 FR4 PCB (1.6 mm Thick &middot; 51.74 &times; 29.0 mm)</text>

  <!-- Onboard Components (Shield Can, USB-C, Buttons) -->
  <!-- USB-C Port (Left / Front) -->
  <rect x="230" y="196" width="70" height="48" rx="3" fill="#8b949e" stroke="#c9d1d9" stroke-width="1.5"/>
  <text x="265" y="225" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle">USB-C</text>

  <!-- Tactile Buttons -->
  <rect x="315" y="206" width="35" height="38" rx="2" fill="#6e7681" stroke="#8b949e" stroke-width="1"/>
  <circle cx="332" cy="198" r="5" fill="#f0883e"/>
  <text x="332" y="230" fill="#ffffff" font-size="9" text-anchor="middle">EN</text>

  <!-- ESP-WROOM-32 Metal Shield Can -->
  <rect x="365" y="194" width="170" height="50" rx="3" fill="#30363d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="450" y="218" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">ESP-WROOM-32 Shield Can</text>
  <text x="450" y="234" fill="#8b949e" font-size="10" text-anchor="middle">Xtensa Dual-Core 240 MHz &middot; 3.2 mm Height</text>

  <!-- PCB Trace Antenna (Right / Back) -->
  <rect x="555" y="228" width="120" height="16" fill="#d29922" stroke="#e3b341" stroke-width="1.5"/>
  <path d="M 565 236 L 575 230 L 585 242 L 595 230 L 605 242 L 615 230 L 625 242 L 635 230 L 645 242 L 655 230 L 665 236" fill="none" stroke="#0d1117" stroke-width="2"/>
  <text x="615" y="220" fill="#e3b341" font-size="11" font-weight="700" text-anchor="middle">2.4 GHz Antenna</text>

  <!-- Headroom Indicator above chips -->
  <line x1="365" y1="168" x2="535" y2="168" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="3"/>
  <line x1="450" y1="168" x2="450" y2="194" stroke="#3fb950" stroke-width="1.5"/>
  <text x="450" y="184" fill="#3fb950" font-size="11" font-weight="600" text-anchor="middle">1.7 mm Headroom</text>

  <!-- Snap-Fit Top Lid (Z = 17.5 to 19.1mm) -->
  <rect x="180" y="138" width="540" height="30" rx="4" fill="#21262d" stroke="#a371f7" stroke-width="2"/>
  
  <!-- Lid Snap Tabs (Insert 1.8mm down to Z = 15.7mm) -->
  <rect x="210" y="168" width="18" height="28" fill="#8957e5"/>
  <rect x="672" y="168" width="18" height="28" fill="#8957e5"/>

  <!-- Antenna Open Window Cutout (Zero Detuning) -->
  <rect x="550" y="132" width="130" height="42" fill="#0d1117" stroke="#f0883e" stroke-width="2.5" stroke-dasharray="5"/>
  <text x="615" y="158" fill="#f0883e" font-size="11" font-weight="700" text-anchor="middle">OPEN APERTURE</text>
  <text x="615" y="172" fill="#f0883e" font-size="9" font-weight="600" text-anchor="middle">Zero Dielectric Detuning</text>

  <!-- Button Port Cutout (EN) -->
  <circle cx="332" cy="153" r="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="332" y="130" fill="#58a6ff" font-size="10" text-anchor="middle">4.2mm Port</text>

  <!-- Thermal Convection Slots -->
  <rect x="390" y="145" width="8" height="16" rx="2" fill="#0d1117"/>
  <rect x="410" y="145" width="8" height="16" rx="2" fill="#0d1117"/>
  <rect x="430" y="145" width="8" height="16" rx="2" fill="#0d1117"/>
  <rect x="450" y="145" width="8" height="16" rx="2" fill="#0d1117"/>
  <text x="425" y="130" fill="#8b949e" font-size="10" text-anchor="middle">Cooling Vents</text>

  <!-- Dimension Callouts -->
  <text x="145" y="445" fill="#8b949e" font-size="11" text-anchor="end">Z = 0.0 mm</text>
  <text x="145" y="285" fill="#8b949e" font-size="11" text-anchor="end">Z = 11.0 mm (Shelf)</text>
  <text x="145" y="257" fill="#8b949e" font-size="11" text-anchor="end">Z = 12.6 mm (PCB)</text>
  <text x="145" y="200" fill="#8b949e" font-size="11" text-anchor="end">Z = 15.8 mm (Chips)</text>
  <text x="145" y="173" fill="#8b949e" font-size="11" text-anchor="end">Z = 17.5 mm (Rim)</text>
  <text x="145" y="143" fill="#8b949e" font-size="11" text-anchor="end">Z = 19.1 mm (Top)</text>
</svg>