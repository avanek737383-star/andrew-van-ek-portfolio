<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robo-Karaoke Studio | Andrew Van Ek Portfolio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Chakra+Petch:wght@600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #001226;
    color: #f8f9fa;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* B-ROLL BACKGROUND CANVAS */
  #brollCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
  }

  /* CRT / VHS OVERLAYS */
  .vhs-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 18, 38, 0.22) 0px,
      rgba(0, 18, 38, 0.22) 1px,
      transparent 1px,
      transparent 3px
    );
  }
  .vignette {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(circle at center, transparent 38%, rgba(0, 18, 38, 0.88) 100%);
  }

  /* TOP HUD - PORTFOLIO TECH BADGE THEME */
  .hud-top {
    position: absolute;
    top: 20px;
    left: 28px;
    right: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }
  .vcr-badge {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0, 45, 90, 0.78);
    border: 1px solid rgba(147, 197, 253, 0.3);
    box-shadow: 0 8px 24px rgba(0, 20, 50, 0.45);
    padding: 8px 18px;
    border-radius: 50px;
    backdrop-filter: blur(12px);
  }
  .vcr-play {
    color: #93c5fd;
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.5px;
  }
  .vcr-play.playing {
    color: #00ff88;
  }
  .vcr-play.stopped {
    color: #ff4757;
  }
  .vcr-indicator-dot {
    width: 9px;
    height: 9px;
    background: currentColor;
    border-radius: 50%;
    box-shadow: 0 0 8px currentColor;
  }
  .vcr-play.playing .vcr-indicator-dot {
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .vcr-time {
    color: #ffffff;
    font-family: 'Chakra Petch', monospace;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1.5px;
  }

  .track-meta {
    text-align: right;
    background: rgba(0, 45, 90, 0.78);
    border: 1px solid rgba(147, 197, 253, 0.3);
    box-shadow: 0 8px 24px rgba(0, 20, 50, 0.45);
    padding: 8px 20px;
    border-radius: 50px;
    backdrop-filter: blur(12px);
  }
  .track-title {
    font-size: 14px;
    color: #ffffff;
    font-weight: 800;
    letter-spacing: 0.8px;
  }
  .track-sub {
    font-size: 11px;
    color: #93c5fd;
    font-weight: 500;
    margin-top: 1px;
  }

  /* KARAOKE STAGE (POSITIONED UPPER-MID) */
  .karaoke-stage {
    position: absolute;
    top: 85px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 1040px;
    text-align: center;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }

  /* PRECISION FIXED BOUNCING MIC (Direct viewport coordinates, locked underneath active word) */
  #micBouncer {
    position: fixed;
    font-size: 19px;
    filter: drop-shadow(0 0 8px #00ffff);
    pointer-events: none;
    z-index: 999;
    opacity: 0;
    transition: left 0.08s ease-out;
  }

  .lyric-box {
    background: rgba(0, 25, 55, 0.84);
    border: 1.5px solid rgba(147, 197, 253, 0.38);
    border-radius: 20px;
    padding: 24px 38px 32px 38px;
    box-shadow: 0 20px 50px rgba(0, 10, 30, 0.8), inset 0 0 30px rgba(0, 86, 179, 0.25);
    backdrop-filter: blur(18px);
    width: 100%;
    position: relative;
    min-height: 135px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .section-tag {
    font-size: 12px;
    color: #93c5fd;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
    background: rgba(0, 86, 179, 0.35);
    padding: 3px 12px;
    border-radius: 50px;
    border: 1px solid rgba(147, 197, 253, 0.3);
  }

  /* CURRENT ACTIVE LINE */
  .line-active {
    font-size: 38px;
    font-weight: 800;
    line-height: 1.35;
    letter-spacing: -0.3px;
    color: #ffffff;
    text-shadow: 0 4px 14px rgba(0, 10, 30, 0.95);
    position: relative;
    display: inline-block;
  }
  .word-span {
    display: inline-block;
    position: relative;
    margin: 0 5px;
    transition: color 0.08s linear, transform 0.1s ease;
  }
  .word-span.sung {
    color: #ffd700;
    text-shadow: 0 0 16px rgba(255, 215, 0, 0.7), 0 0 28px rgba(255, 140, 0, 0.5);
    transform: scale(1.05);
  }
  .word-span.highlight-now {
    color: #38bdf8;
    text-shadow: 0 0 20px #38bdf8, 0 0 35px #0056b3;
    transform: scale(1.14) translateY(-3px);
  }

  /* NEXT PREVIEW LINE */
  .line-next {
    margin-top: 14px;
    font-size: 21px;
    font-weight: 600;
    color: rgba(147, 197, 253, 0.55);
    text-shadow: 0 2px 6px rgba(0, 10, 30, 0.8);
  }

  /* PORTFOLIO-THEMED CONTROLS BAR */
  .controls-bar {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 860px;
    background: rgba(0, 45, 90, 0.82);
    border: 1px solid rgba(147, 197, 253, 0.28);
    box-shadow: 0 15px 40px rgba(0, 15, 40, 0.65);
    border-radius: 50px;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 18px;
    z-index: 20;
    backdrop-filter: blur(16px);
  }
  .btn-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #0056b3, #0070f3);
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0, 112, 243, 0.45);
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.15s ease;
  }
  .btn-circle:hover { 
    transform: scale(1.08); 
    background: linear-gradient(135deg, #0070f3, #38bdf8);
    box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5); 
  }
  .btn-pill {
    padding: 8px 18px;
    border-radius: 50px;
    border: 1px solid rgba(147, 197, 253, 0.25);
    background: rgba(255, 255, 255, 0.08);
    color: #eaf3ff;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s, border-color 0.2s;
  }
  .btn-pill:hover { 
    background: rgba(255, 255, 255, 0.18); 
    border-color: rgba(147, 197, 253, 0.5);
    transform: translateY(-1px); 
  }
  .progress-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .progress-bar-bg {
    width: 100%;
    height: 7px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 50px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #0056b3, #0070f3, #38bdf8);
    border-radius: 50px;
    box-shadow: 0 0 10px #38bdf8;
  }
</style>
</head>

</div>

}

// B-ROLL PROCEDURAL ANIMATOR (FREEZES WHEN PAUSED OR STOPPED)
let animFrame = 0;
function drawBroll() {
  if (audio && !audio.paused && !audio.ended) {
    animFrame++;
  }

  const w = canvas.width;
  const h = canvas.height;

  const songProgress = audio.duration ? (audio.currentTime / audio.duration) : 0;
  const autoScene = Math.floor(songProgress * 4) % 4;
  const activeScene = (sceneIndex === 0) ? autoScene : (sceneIndex - 1);

  if (activeScene === 0) {
    // 1. TOKYO SHIBUYA NEON NIGHT
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#001226');
    grad.addColorStop(0.65, '#002d5a');
    grad.addColorStop(1, '#000b18');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = '#001833';
    for(let i=0; i<w; i+=80) {
      const bh = ((Math.sin(i*0.02) + 1.2) * 160) + 120;
      ctx.fillRect(i, h*0.65 - bh, 74, bh + h*0.35);
      for(let y = h*0.65 - bh + 15; y < h*0.65; y += 22) {
        if ((i + y + animFrame) % 7 === 0) {
          ctx.fillStyle = (i % 3 === 0) ? 'rgba(56, 189, 248, 0.75)' : 'rgba(0, 112, 243, 0.75)';
          ctx.fillRect(i + 12, y, 12, 14);
          ctx.fillStyle = '#001833';
        }
      }
    }

    const roadGrad = ctx.createLinearGradient(0, h*0.65, 0, h);
    roadGrad.addColorStop(0, '#002040');
    roadGrad.addColorStop(1, '#000c1c');
    ctx.fillStyle = roadGrad;
    ctx.fillRect(0, h*0.65, w, h*0.35);

    for (let j = 0; j < 12; j++) {
      const rx = (j * (w / 12) + (animFrame * 0.8)) % w;
      const rColor = (j % 2 === 0) ? 'rgba(56, 189, 248, 0.15)' : 'rgba(0, 112, 243, 0.15)';
      ctx.fillStyle = rColor;
      ctx.fillRect(rx - 25, h*0.65, 50, h*0.35);
    }
  } else if (activeScene === 1) {
    // 2. RETRO SUNSET BEACH
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#002244');
    grad.addColorStop(0.4, '#0056b3');
    grad.addColorStop(0.65, '#fba442');
    grad.addColorStop(1, '#001226');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    const sunX = w * 0.5;
    const sunY = h * 0.55;
    const sunRad = Math.min(w, h) * 0.22;
    const sunGrad = ctx.createRadialGradient(sunX, sunY, sunRad*0.2, sunX, sunY, sunRad);
    sunGrad.addColorStop(0, '#fff494');
    sunGrad.addColorStop(0.7, '#ff5e36');
    sunGrad.addColorStop(1, 'rgba(255, 94, 54, 0)');
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunRad, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(0, 18, 38, 0.88)';
    ctx.fillRect(0, h*0.65, w, h*0.35);
    for (let k = 0; k < 6; k++) {
      const wy = h*0.66 + k * 28;
      ctx.fillStyle = 'rgba(255, 170, 70, 0.25)';
      ctx.fillRect(sunX - 160 + Math.sin(animFrame*0.05 + k)*30, wy, 320, 3);
    }
  } else if (activeScene === 2) {
    // 3. DISCO LASER 3D PERSPECTIVE GRID
    ctx.fillStyle = '#000e1f';
    ctx.fillRect(0, 0, w, h);

    const horizon = h * 0.55;
    ctx.strokeStyle = 'rgba(0, 112, 243, 0.45)';
    ctx.lineWidth = 2;
    const cx = w * 0.5;
    for (let x = -w; x <= w * 2; x += 90) {
      ctx.beginPath();
      ctx.moveTo(cx, horizon);
      ctx.lineTo(x + (Math.sin(animFrame * 0.02) * 50), h);
      ctx.stroke();
    }
    const speed = (animFrame * 2) % 40;
    for (let y = horizon; y <= h; y += (y - horizon) * 0.25 + 6) {
      const realY = y + speed * ((y - horizon) / (h - horizon));
      if (realY <= h) {
        ctx.strokeStyle = 'rgba(56, 189, 248, ' + Math.min(0.85, (realY - horizon) / (h - horizon)) + ')';
        ctx.beginPath();
        ctx.moveTo(0, realY);
        ctx.lineTo(w, realY);
        ctx.stroke();
      }
    }
    for(let b=0; b<4; b++) {
      ctx.strokeStyle = (b % 2 === 0) ? 'rgba(56, 189, 248, 0.35)' : 'rgba(0, 112, 243, 0.35)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx, 0);
      ctx.lineTo((w * 0.25 * b) + Math.sin(animFrame*0.04 + b) * 150, horizon);
      ctx.stroke();
    }
  } else {
    // 4. CYBER HIGHWAY NIGHT DRIVE
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, '#000814');
    grad.addColorStop(0.55, '#001e3d');
    grad.addColorStop(1, '#000e1f');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = '#fff';
    for(let s=0; s<40; s++) {
      const sx = (s * 137.5) % w;
      const sy = (s * 83.1) % (h * 0.5);
      ctx.fillRect(sx, sy, 2, 2);
    }
    const hx = w * 0.5;
    const hy = h * 0.52;
    ctx.fillStyle = '#001428';
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(0, h);
    ctx.lineTo(w, h);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 4;
    const offset = (animFrame * 8) % 60;
    for(let r=hy; r<h; r += (r - hy) * 0.4 + 10) {
      ctx.beginPath();
      ctx.moveTo(hx, r + offset * ((r-hy)/(h-hy)));
      ctx.lineTo(hx, r + 20 + offset * ((r-hy)/(h-hy)));
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.7)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(hx - 30, hy);
    ctx.lineTo(w * 0.25, h);
    ctx.stroke();
  }

  requestAnimationFrame(drawBroll);
}
requestAnimationFrame(drawBroll);

function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  const ms = Math.floor((sec % 1) * 10);
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${ms}`;
}

function updateLyrics() {
  const t = audio.currentTime;

  vcrTimer.textContent = fmtTime(t);
  progressBarFill.style.width = ((t / (audio.duration || 149.5)) * 100) + '%';

  let activeIdx = -1;
  for (let i = 0; i < LYRICS.length; i++) {
    if (t >= LYRICS[i].start && t < LYRICS[i].end) {
      activeIdx = i;
      break;
    }
  }

  if (activeIdx !== -1 && activeIdx !== currentLineIndex) {
    currentLineIndex = activeIdx;
    const line = LYRICS[activeIdx];
    const nextLine = LYRICS[activeIdx + 1];

    sectionTag.textContent = line.sub || 'ROBO-KARAOKE';
    micBouncer.style.opacity = 1;

    lineActive.innerHTML = line.words.map((w, idx) => {
      return `<span class="word-span" id="word_${idx}">${w.w}</span>`;
    }).join(' ');

    lineNext.textContent = nextLine ? nextLine.text : '★ END OF SONG ★';
  } else if (activeIdx === -1 && t < 0.2) {
    sectionTag.textContent = 'PORTFOLIO AUDIO LAB';
    lineActive.textContent = 'Press Play to Start Robo-Karaoke! 🎤';
    lineNext.textContent = LYRICS[0] ? LYRICS[0].text : '';
    micBouncer.style.opacity = 0;
  }

  // WORD-BY-WORD HIGHLIGHTING AND PRECISION UNDERNEATH MIC BOUNCE
  if (currentLineIndex !== -1) {
    const words = LYRICS[currentLineIndex].words;
    let activeWordSpan = null;

    for (let idx = 0; idx < words.length; idx++) {
      const span = document.getElementById(`word_${idx}`);
      if (!span) continue;
      const wordStart = words[idx].t;
      const nextWordStart = words[idx + 1] ? words[idx + 1].t : LYRICS[currentLineIndex].end;

      if (t >= wordStart && t < nextWordStart) {
        span.className = 'word-span highlight-now';
        activeWordSpan = span;
      } else if (t >= nextWordStart) {
        span.className = 'word-span sung';
      } else {
        span.className = 'word-span';
      }
    }

    if (activeWordSpan) {
      // Direct viewport coordinates because micBouncer is position: fixed
      const rect = activeWordSpan.getBoundingClientRect();
      const targetX = rect.left + (rect.width / 2);
      
      // Placed directly UNDERNEATH the word with tempo-synced beat bounce
      const beat = (t * (172 / 60)) % 1;
      const hopY = Math.sin(beat * Math.PI) * 4;
      const targetY = rect.bottom + 6 - hopY;

      micBouncer.style.left = targetX + 'px';
      micBouncer.style.top = targetY + 'px';
      micBouncer.style.transform = 'translate(-50%, 0) scale(1.1)';
      micBouncer.style.opacity = 1;
    }
  }

  requestAnimationFrame(updateLyrics);
}
requestAnimationFrame(updateLyrics);

// PLAY / PAUSE CONTROLS
playBtn.addEventListener('click', () => {
  if (audio.paused) {
    audio.play();
    playBtn.textContent = '❚❚';
    vcrState.className = 'vcr-play playing';
    vcrStateText.textContent = 'PLAY ▶';
  } else {
    audio.pause();
    playBtn.textContent = '▶';
    vcrState.className = 'vcr-play';
    vcrStateText.textContent = 'PAUSE ❚❚';
  }
});

// AUDIO ENDED EVENT (STOPS CLEANLY & FREEZES)
audio.addEventListener('ended', () => {
  playBtn.textContent = '▶';
  vcrState.className = 'vcr-play stopped';
  vcrStateText.textContent = 'STOPPED ⏹';
  micBouncer.style.opacity = 0;
  sectionTag.textContent = '★ PERFECT SCORE: 100 PTS ★';
  lineActive.textContent = '★ GREAT JOB! ROBOT KARAOKE MASTER ★';
  lineNext.textContent = 'Press Play to Sing Again! 🔁';
});

// PROGRESS BAR SEEK
progressBarBg.addEventListener('click', (e) => {
  const rect = progressBarBg.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * (audio.duration || 149.5);
});

// SCENE SWITCHER
sceneBtn.addEventListener('click', () => {
  sceneIndex = (sceneIndex + 1) % 5;
  sceneBtn.textContent = sceneIndex === 0 ? 'Scene: Auto Cycle 🔄' : 'Scene: ' + SCENES[sceneIndex - 1];
});

// VHS TOGGLE
vhsBtn.addEventListener('click', () => {
  if (vhsOverlay.style.display === 'none') {
    vhsOverlay.style.display = 'block';
    vhsBtn.textContent = 'CRT: ON 📺';
  } else {
    vhsOverlay.style.display = 'none';
    vhsBtn.textContent = 'CRT: OFF 📺';
  }
});

// FULLSCREEN
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});

// KEYBOARD SHORTCUTS
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    playBtn.click();
  }
});
</script>
</body>
</html>
